name: "debug: 麒麟依赖探测"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe (aarch64 / kylin)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container:
      image: hxsoong/kylin:v10-sp3
      options: --user root
    steps:
      - name: protobuf 库文件清单
        shell: bash
        run: |
          set +e
          dnf -y install protobuf protobuf-devel >/dev/null 2>&1
          echo "--- /usr/lib64/libprotobuf* ---"; ls -l /usr/lib64/libprotobuf* 2>/dev/null
          echo "--- pkgconfig ---"; ls /usr/lib64/pkgconfig/protobuf* 2>/dev/null
          echo "--- protoc ---"; command -v protoc; protoc --version
          echo "--- cmake 版本 ---"; cmake --version | head -1
