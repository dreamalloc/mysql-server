name: "debug: 麒麟依赖探测"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe (aarch64 / kylin)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container:
      image: hxsoong/kylin:v10-sp3
      options: --user root
    steps:
      - name: 工具链可选项
        shell: bash
        run: |
          set +e
          echo "--- 默认工具链 ---"; gcc --version | head -1; g++ --version | head -1
          echo "--- gcc-toolset 可用性 ---"
          dnf list --available 'gcc-toolset*' 2>/dev/null | tail -n +1 | head -20
          echo "--- devtoolset 可用性 ---"
          dnf list --available 'devtoolset*' 2>/dev/null | head -10
          echo "--- 其他更新版 gcc ---"
          dnf list --available 'gcc*' 2>/dev/null | grep -E "^gcc" | head -10
