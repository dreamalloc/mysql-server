name: "debug: 麒麟依赖探测"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe (aarch64 / kylin)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container:
      image: hxsoong/kylin:v10-sp3
      options: --user root
    steps:
      - name: protobuf 可用性
        shell: bash
        run: |
          set +e
          echo "--- 可用 protobuf*n ---"
          dnf list --available 'protobuf*' 2>/dev/null | tail -12
          echo "--- 已装 ---"; rpm -qa 'protobuf*' | head
          echo "--- 装 devel + compiler ---"
          dnf -y install protobuf-devel protobuf-compiler; echo "exit=$?"
          rpm -q protobuf-devel protobuf-compiler
          echo "--- 版本 ---"
          protoc --version 2>/dev/null || echo "(no protoc)"
          grep -h "GOOGLE_PROTOBUF_VERSION " /usr/include/google/protobuf/stubs/common.h 2>/dev/null | head -2
