name: "debug: 麒麟依赖探测"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe (aarch64 / kylin)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container:
      image: hxsoong/kylin:v10-sp3
      options: --user root
    steps:
      - name: libprotobuf 是否含 lite 符号
        shell: bash
        run: |
          set +e
          dnf -y install protobuf protobuf-devel binutils >/dev/null 2>&1
          echo "--- libprotobuf.so 里的 MessageLite 符号数 ---"
          nm -D --defined-only /usr/lib64/libprotobuf.so.23 2>/dev/null | grep -c "MessageLite"
          echo "--- 抽样 ---"
          nm -D --defined-only /usr/lib64/libprotobuf.so.23 2>/dev/null | grep "MessageLite" | head -5
          echo "--- 文件清单（devel 包）---"
          rpm -ql protobuf-devel | grep -E "libprotobuf|protoc" | head
